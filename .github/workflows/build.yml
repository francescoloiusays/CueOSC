name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            extra: ""
          - os: macos-latest
            name: macOS
            extra: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Configura
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra }}
        shell: bash

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Test (OSC su loopback)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Carica il plugin
        uses: actions/upload-artifact@v4
        with:
          name: CueOSC-${{ matrix.name }}
          path: build/CueOSC_artefacts/Release/VST3/

      - name: Controllo con pluginval (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath ./pluginval/pluginval.exe -Wait -PassThru -NoNewWindow -ArgumentList '--strictness-level','5','--skip-gui-tests','--validate-in-process','--validate','build/CueOSC_artefacts/Release/VST3/CueOSC.vst3'
          Write-Host "pluginval exit code: $($p.ExitCode)"
          exit $p.ExitCode

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Zip
        run: |
          (cd CueOSC-Windows && zip -r ../CueOSC-Windows.zip .)
          (cd CueOSC-macOS && zip -r ../CueOSC-macOS.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            CueOSC-Windows.zip
            CueOSC-macOS.zip
